[workspace]
resolver = "2"
members = ["crates/core", "crates/proto", "crates/daemon", "crates/cli", "crates/adapter-dummy", "crates/browser", "crates/adapter-recipe", "crates/adapter-agent", "crates/mcp", "crates/chrome"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "AGPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "process", "fs"] }
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
rand = "0.8"
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.28"
crossterm = "0.28"
toml = "0.8"
croner = "2"
kdl = "6"
tracing = "0.1"
tracing-subscriber = "0.3"
futures-util = "0.3"
axum = { version = "0.7", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
parking_lot = "0.12"
sha2 = "0.10"
base64 = "0.22"
