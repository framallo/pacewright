# ~/.pacewright/config.toml — copy and edit.
# Every (platform, action) that needs throttling gets a limit key.
# Keys not listed here are unrestricted.

# The always-on Chrome that pacewright ATTACHES to, started by the launchd job
# (packaging/com.paperclip.pacewright-chrome.plist). pacewright never launches a browser itself:
# a CDP-launched browser is a bot signal, so a social network walls the profile and revokes `li_at`, and
# Google refuses sign-in on it outright. Sites are separated by named TABS in this one Chrome.
#
# Must match the job's --remote-debugging-port. Omit the section for the default below.
# "auto" lets chrome-agent discover the endpoint itself. PACEWRIGHT_CHROME_CONNECT overrides both.
[browser]
connect = "http://127.0.0.1:9222"

[limits."dummy.capped"]
daily_cap = 3
min_gap   = "8m"
jitter    = 0.5
active    = "09:00-18:00"

# Real keys arrive with their adapters (M3+):
# [limits."acme.post"]           daily_cap = 3   min_gap = "45m"  jitter = 0.5  active = "09:00-18:00"
# [limits."acme.comment"]        daily_cap = 15  min_gap = "8m"   jitter = 0.5  active = "09:00-18:00"
# [limits."acme.profile_scrape"] daily_cap = 40  min_gap = "20s"  jitter = 0.3
